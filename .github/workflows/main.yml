name: python-deployment

run-name: >-
  ${{ github.actor }} - ${{ github.event_name }} - ${{ github.ref_name }} -
  ${{ github.event.inputs.deploy_artifact || 'ubuntu-3.9' }}

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:
    inputs:
      deploy_artifact:
        required: true
        default: ubuntu-3.9
        type: choice
        options:
          - ubuntu-3.8
          - ubuntu-3.9
          - windows-3.8
          - windows-3.9

env:
  DockerImageName: eldard/todoapp
  DefaultDeployArtifact: ubuntu-3.9

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  prepare:
    name: Resolve Python Version
    runs-on: ubuntu-latest
    outputs:
      deploy_artifact: ${{ steps.selection.outputs.deploy_artifact }}
      python_version: ${{ steps.selection.outputs.python_version }}
      image_repository: ${{ steps.selection.outputs.image_repository }}
    steps:
      - name: Select Deploy Artifact
        id: selection
        shell: bash
        run: |
          ARTIFACT="${{ github.event.inputs.deploy_artifact || env.DefaultDeployArtifact }}"
          echo "deploy_artifact=${ARTIFACT}" >> "$GITHUB_OUTPUT"
          echo "python_version=${ARTIFACT#*-}" >> "$GITHUB_OUTPUT"
          echo "image_repository=${{ env.DockerImageName }}" >> "$GITHUB_OUTPUT"


  python-ci:
    name: Python CI (${{ matrix.os }}, Python ${{ matrix.python_version }})
    runs-on: ${{ matrix.runner }}
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu, windows]
        python_version: ["3.8", "3.9"]
        include:
          # Python 3.8 is EOL and has no prebuilt binaries for newer Ubuntu images
          - os: ubuntu
            runner: ubuntu-22.04
          - os: windows
            runner: windows-latest
    defaults:
      run:
        working-directory: ./src
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python_version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python_version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install coverage flake8
          pip install -r requirements.txt

      - name: Run tests
        run: |
          python manage.py test

      - name: Generate Report
        run: |
          coverage run --source='.' manage.py test
          coverage report

      - name: Linting
        run: |
          flake8 . --show-source --statistics --exit-zero

      - name: Check Complexity
        run: |
          flake8 . --exit-zero --max-complexity=6

      - name: Upload python artifacts
        uses: actions/upload-artifact@v4
        with:
          name: python-artifacts-${{ matrix.os }}-${{ matrix.python_version }}
          path: src


  docker-ci:
    name: Build and Push Image
    runs-on: ubuntu-latest
    if: ${{ github.ref_name == 'main' }}
    needs: [prepare, python-ci]
    steps:

    - uses: actions/download-artifact@v4
      name: Download python artifacts
      with:
        name: python-artifacts-${{ needs.prepare.outputs.deploy_artifact }}
        path: .

    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Build and push
      uses: docker/build-push-action@v5
      with:
        push: true
        context: ./src
        build-args: |
          PYTHON_VERSION=${{ needs.prepare.outputs.python_version }}
        tags: ${{ needs.prepare.outputs.image_repository }}:${{ github.sha }}

  helm-ci:
    runs-on: ubuntu-latest
    needs: python-ci
    if: github.ref_name == 'main'
    name: Helm CI
    defaults:
      run:
        working-directory: ./helm-charts
    steps:

    - name: Checkout
      uses: actions/checkout@v4

    - name: Upload helm artifacts
      uses: actions/upload-artifact@v4
      with:
        name: helm-artifacts
        path: helm-charts

    - name: Upload kind cluster artifact
      uses: actions/upload-artifact@v4
      with:
        name: kind-cluster
        path: cluster.yml

    - name: Set Up Helm
      uses: azure/setup-helm@v4.2.0

    - name: Lint helm
      run: helm lint ./todoapp/

    - name: Template Helm
      run: helm template todoapp ./todoapp/ -f ./todoapp/values.yaml

    - name: Package Helm
      run: helm package ./todoapp

    - name: Upload Helm Artifact
      uses: actions/upload-artifact@v4
      with:
        name: helm-package
        path: helm-charts/*.tgz

  deploy-helm-dev:
    name: Deploy helm to Development
    uses: ./.github/workflows/reusable-deployment.yml
    needs: [prepare, helm-ci, docker-ci]
    secrets: inherit
    with:
      environment: development
      version: ${{ github.sha }}
      image-repository: ${{ needs.prepare.outputs.image_repository }}
      selected-artifact: ${{ needs.prepare.outputs.deploy_artifact }}

  deploy-helm-stg:
    name: Deploy helm to Staging
    uses: ./.github/workflows/reusable-deployment.yml
    needs: [prepare, deploy-helm-dev]
    secrets: inherit
    with:
      environment: staging
      version: ${{ github.sha }}
      image-repository: ${{ needs.prepare.outputs.image_repository }}
      selected-artifact: ${{ needs.prepare.outputs.deploy_artifact }}
      helm-values-path: ./todoapp/values/stg.yaml
      helm-release-name: todoapp-staging
